name: 发布 RP2 固件

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-rp2:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          - RPI_PICO
          - RPI_PICO2
          - FN_VISION_RP2040_4M

    env:
      BOARD: ${{ matrix.board }}

    steps:
      - name: 检出源代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 安装 RP2 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            pkg-config \
            python3 \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: 构建 mpy-cross
        run: |
          make -C mpy-cross USER_C_MODULES=

      - name: 准备 RP2 子模块
        run: |
          make -C ports/rp2 submodules

      - name: 构建 RP2 固件
        run: |
          make -C ports/rp2 BOARD=${BOARD} \
            USER_C_MODULES=modules/micropython.cmake

      - name: 校验 RP2 原生模块
        run: |
          grep -q "MP_QSTR_fn_canvas" \
            ports/rp2/build-${BOARD}/genhdr/qstrdefs.generated.h
          grep -q "MP_QSTR_fn_protocol" \
            ports/rp2/build-${BOARD}/genhdr/qstrdefs.generated.h
          if [[ "${BOARD}" == "FN_VISION_RP2040_4M" ]]; then
            grep -q "MP_QSTR_font_glyph" \
              ports/rp2/build-${BOARD}/genhdr/qstrdefs.generated.h
            grep -q "MP_QSTR_text_width" \
              ports/rp2/build-${BOARD}/genhdr/qstrdefs.generated.h
          fi
          test -s "ports/rp2/build-${BOARD}/firmware.uf2"

      - name: 整理 RP2 发布文件
        run: |
          mkdir -p dist
          cp ports/rp2/build-${BOARD}/firmware.uf2 \
            dist/micropython-${BOARD}-${GITHUB_REF_NAME}.uf2
          ls -lh dist

      - name: 上传 RP2 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ env.BOARD }}-${{ github.ref_name }}
          path: dist/*.uf2
          if-no-files-found: error

  release-rp2:
    needs: build-rp2
    runs-on: ubuntu-latest

    concurrency:
      group: firmware-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: 下载 RP2 构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: micropython-*-${{ github.ref_name }}
          path: dist
          merge-multiple: true

      - name: 校验 RP2 发布文件
        run: |
          test -f "dist/micropython-RPI_PICO-${GITHUB_REF_NAME}.uf2"
          test -f "dist/micropython-RPI_PICO2-${GITHUB_REF_NAME}.uf2"
          test -f "dist/micropython-FN_VISION_RP2040_4M-${GITHUB_REF_NAME}.uf2"
          ls -lh dist

      - name: 发布 RP2 固件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "RP2 MicroPython 固件；四兆字节 fn-vision 版本内置 fn_canvas API v8、文泉驿点阵正黑与 Fusion Pixel 双语字体。"
          fi

          gh release upload "$TAG" dist/*.uf2 --clobber
